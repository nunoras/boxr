[package]
name = "boxr"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Launch coding agents on any harness and record every session in a local ledger"
license = "Apache-2.0"
repository = "https://github.com/nunoras/boxr"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3.5.2"
duckdb = { version = "=1.2.2", features = ["bundled", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
ctrlc = { version = "3.5.2", features = ["termination"] }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[profile.release]
strip = true

[dev-dependencies]
tempfile = "3"
