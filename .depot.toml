base_branch = "main"

[profiles]
plan = "grok-plan"
build = "grok-build"
review = "grok-review"
fix = "grok-fix"

[validation]
command = "cargo test"

[pull_request]
base = "main"
auto_merge = true

[questions]
always_relay = false

[dispatch]
confidence_floor = 0.8

[[dispatch.rules]]
when = "Implement or repair software"
role = "build"
candidates = ["grok-build"]

[[dispatch.rules]]
when = "Review a change"
role = "review"
candidates = ["grok-review"]

[[dispatch.rules]]
when = "Plan work or write a design"
role = "plan"
candidates = ["grok-plan"]

[[dispatch.rules]]
when = "Fix a validation or review failure"
role = "fix"
candidates = ["grok-fix"]
